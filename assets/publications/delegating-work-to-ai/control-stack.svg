<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">AI Delegation Control Stack</title>
  <desc id="desc">A layered control stack showing that task-level AI use decisions sit inside wider legal, organisational, governance, and workflow controls.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 30px Arial, sans-serif; fill: #1f2933; }
      .label { font: 700 21px Arial, sans-serif; fill: #1f2933; }
      .small { font: 500 15px Arial, sans-serif; fill: #405466; }
      .section { font: 700 16px Arial, sans-serif; fill: #405466; text-transform: uppercase; letter-spacing: .5px; }
      .layer { fill: #f8fafc; stroke: #9aa8b5; stroke-width: 1.5; rx: 14; }
      .inner { fill: #eef4f8; stroke: #55738b; stroke-width: 2; rx: 14; }
      .decision { fill: #f4f0e8; stroke: #9b7b3b; stroke-width: 2; rx: 14; }
      .line { stroke: #6b7c8b; stroke-width: 2; fill: none; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <text x="600" y="56" text-anchor="middle" class="title">Where the Practical Delegation Test Sits</text>
  <text x="600" y="96" text-anchor="middle" class="small">Task-level AI decisions should operate inside wider obligations and controls, not outside them.</text>

  <rect x="120" y="140" width="960" height="78" class="layer"/>
  <text x="600" y="174" text-anchor="middle" class="label">Law, regulation, and professional obligations</text>
  <text x="600" y="200" text-anchor="middle" class="small">Non-negotiable external requirements and duties of care</text>

  <rect x="165" y="246" width="870" height="78" class="layer"/>
  <text x="600" y="280" text-anchor="middle" class="label">Organisational policy and risk controls</text>
  <text x="600" y="306" text-anchor="middle" class="small">Internal rules, approved tools, security expectations, and risk appetite</text>

  <rect x="210" y="352" width="780" height="78" class="layer"/>
  <text x="600" y="386" text-anchor="middle" class="label">Domain-specific governance and assurance</text>
  <text x="600" y="412" text-anchor="middle" class="small">Controls that reflect the work domain, audience, evidence needs, and consequence level</text>

  <rect x="255" y="458" width="690" height="78" class="layer"/>
  <text x="600" y="492" text-anchor="middle" class="label">Workflow design, approvals, and review controls</text>
  <text x="600" y="518" text-anchor="middle" class="small">How work moves, who checks it, and who can stop it progressing</text>

  <rect x="330" y="564" width="540" height="76" class="inner"/>
  <text x="600" y="597" text-anchor="middle" class="section">Practical operating test</text>
  <text x="600" y="623" text-anchor="middle" class="label">The Practical Delegation Test</text>

  <rect x="390" y="672" width="420" height="58" class="decision"/>
  <text x="600" y="707" text-anchor="middle" class="label">Task-level AI use decision</text>

  <line x1="600" y1="218" x2="600" y2="246" class="line"/>
  <line x1="600" y1="324" x2="600" y2="352" class="line"/>
  <line x1="600" y1="430" x2="600" y2="458" class="line"/>
  <line x1="600" y1="536" x2="600" y2="564" class="line"/>
  <line x1="600" y1="640" x2="600" y2="672" class="line"/>
</svg>
