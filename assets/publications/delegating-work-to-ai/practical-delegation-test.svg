<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">The Practical Delegation Test</title>
  <desc id="desc">A decision canvas showing task framing, four diagnostic checks, delegation choices, and accountability controls.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 30px Arial, sans-serif; fill: #1f2933; }
      .section { font: 700 17px Arial, sans-serif; fill: #405466; text-transform: uppercase; letter-spacing: .5px; }
      .label { font: 700 20px Arial, sans-serif; fill: #1f2933; }
      .small { font: 500 15px Arial, sans-serif; fill: #405466; }
      .panel { fill: #f8fafc; stroke: #9aa8b5; stroke-width: 1.5; rx: 14; }
      .decision { fill: #f4f0e8; stroke: #9b7b3b; stroke-width: 2; rx: 14; }
      .choice { fill: #ffffff; stroke: #b8c2cc; stroke-width: 1.4; rx: 10; }
      .accountability { fill: #eef7f0; stroke: #5d8c64; stroke-width: 2; rx: 14; }
      .line { stroke: #6b7c8b; stroke-width: 2; fill: none; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <text x="600" y="56" text-anchor="middle" class="title">The Practical Delegation Test</text>
  <rect x="70" y="92" width="300" height="570" class="panel"/>
  <text x="220" y="130" text-anchor="middle" class="section">Diagnostic checks</text>
  <text x="220" y="180" text-anchor="middle" class="label">1. Outcome clarity</text>
  <text x="220" y="206" text-anchor="middle" class="small">Can the desired result, audience,</text>
  <text x="220" y="226" text-anchor="middle" class="small">constraints, and failure conditions</text>
  <text x="220" y="246" text-anchor="middle" class="small">be described clearly?</text>
  <line x1="105" y1="282" x2="335" y2="282" class="line"/>
  <text x="220" y="330" text-anchor="middle" class="label">2. Verification cost</text>
  <text x="220" y="356" text-anchor="middle" class="small">Can the result be checked well</text>
  <text x="220" y="376" text-anchor="middle" class="small">enough for the task to remain</text>
  <text x="220" y="396" text-anchor="middle" class="small">worth delegating?</text>
  <line x1="105" y1="432" x2="335" y2="432" class="line"/>
  <text x="220" y="480" text-anchor="middle" class="label">3. Human judgment</text>
  <text x="220" y="506" text-anchor="middle" class="small">What trade-offs, promises, risks,</text>
  <text x="220" y="526" text-anchor="middle" class="small">or decisions must stay human?</text>
  <line x1="105" y1="562" x2="335" y2="562" class="line"/>
  <text x="220" y="602" text-anchor="middle" class="label">4. Uncertainty ownership</text>
  <text x="220" y="628" text-anchor="middle" class="small">Where does residual uncertainty</text>
  <text x="220" y="648" text-anchor="middle" class="small">land if the output is wrong?</text>
  <rect x="440" y="105" width="320" height="130" class="panel"/>
  <text x="600" y="140" text-anchor="middle" class="section">Starting point</text>
  <text x="600" y="174" text-anchor="middle" class="label">Proposed AI-assisted task</text>
  <text x="600" y="202" text-anchor="middle" class="small">A task, workflow step, or output</text>
  <text x="600" y="222" text-anchor="middle" class="small">someone wants AI to produce</text>
  <rect x="410" y="302" width="380" height="135" class="decision"/>
  <text x="600" y="338" text-anchor="middle" class="section">Decision</text>
  <text x="600" y="373" text-anchor="middle" class="label">Choose delegation level</text>
  <text x="600" y="402" text-anchor="middle" class="small">The test produces a judgement pattern,</text>
  <text x="600" y="422" text-anchor="middle" class="small">not a score.</text>
  <rect x="410" y="522" width="380" height="105" class="accountability"/>
  <text x="600" y="552" text-anchor="middle" class="section">Always retained</text>
  <text x="600" y="586" text-anchor="middle" class="label">Visible human accountability</text>
  <text x="600" y="612" text-anchor="middle" class="small">Ownership remains explicit at every level.</text>
  <rect x="845" y="92" width="285" height="570" class="panel"/>
  <text x="987.5" y="130" text-anchor="middle" class="section">Possible outcomes</text>
  <rect x="875" y="165" width="225" height="72" class="choice"/>
  <text x="987.5" y="194" text-anchor="middle" class="label">Direct delegation</text>
  <text x="987.5" y="218" text-anchor="middle" class="small">AI executes; human checks</text>
  <rect x="875" y="275" width="225" height="72" class="choice"/>
  <text x="987.5" y="304" text-anchor="middle" class="label">Checkpointed</text>
  <text x="987.5" y="328" text-anchor="middle" class="small">Execution between reviews</text>
  <rect x="875" y="385" width="225" height="72" class="choice"/>
  <text x="987.5" y="414" text-anchor="middle" class="label">Human-led</text>
  <text x="987.5" y="438" text-anchor="middle" class="small">AI supports the human</text>
  <rect x="875" y="495" width="225" height="72" class="choice"/>
  <text x="987.5" y="524" text-anchor="middle" class="label">Do not delegate</text>
  <text x="987.5" y="548" text-anchor="middle" class="small">Clarify or handle directly</text>
  <line x1="370" y1="377" x2="410" y2="377" class="line"/>
  <line x1="790" y1="377" x2="845" y2="377" class="line"/>
  <line x1="600" y1="235" x2="600" y2="302" class="line"/>
  <line x1="600" y1="437" x2="600" y2="522" class="line"/>
  <text x="600" y="710" text-anchor="middle" class="small">Use the canvas to make task-level delegation visible enough for leadership, review, and governance.</text>
</svg>
